---
# ------------------------------------------------------------------------------
# Spring Boot Configuration
# ------------------------------------------------------------------------------

spring:
  application:
    name: artventuria
    version: 1.0.0
  main:
    allow-bean-definition-overriding: true
  # Database Configuration
  datasource:
    url: jdbc:postgresql://${database.host:localhost}:${database.port:5432}/${database.name:artventuria}
    username: ${database.username}
    password: ${database.password}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # MongoDB Configuration
  data:
    mongodb:
      # In docker, 'mongodb' is the service name, in local it's localhost
      uri: ${mongodb.uri:mongodb://mongodb:27017}
      database: ${mongodb.database:artventuria}

  # Flyway Configuration
  flyway:
    baseline-on-migrate: true

  # Kafka Configuration
  kafka:
    # In docker, 'kafka' is the service name, in local it's localhost
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: artventuria-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.artventuria.api.dto.notification"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  # Messages Configuration
  messages:
    basename: messages
    encoding: UTF-8

# Server Configuration
server:
  # Port 8080 exposed in the Dockerfile, with PORT as environment variable for flexibility
  port: ${PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: 604800000 # 7 days in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: Origin,Content-Type,Accept,Authorization
  max-age: 300

# Logging Configuration
logging:
  level:
    root: INFO
    com.artventuria: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO

# Firebase Configuration
firebase:
  config:
    path: ${FIREBASE_CONFIG_PATH}
  project-id: ${FIREBASE_PROJECT_ID}

# AWS SES Configuration
aws:
  ses:
    region: ${AWS_SES_REGION}
    from-email: ${AWS_SES_FROM_EMAIL}
    from-name: Artventuria App

# Frontend Configuration
frontend:
  url: ${FRONTEND_URL}
  max-age: 86400
  compress: true

# API Configuration
api:
  url: ${API_URL}

# Mobile Configuration
mobile:
  deeplink:
    reset-password: ${MOBILE_DEEPLINK_RESET_PASSWORD}

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
