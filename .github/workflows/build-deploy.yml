name: Production Docker Release

on:
  push:
    tags:
      - "v*"  # Trigger the workflow when a new tag starting with 'v' is pushed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner for the job

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2  # Checkout the repository to the runner

      - name: Set up JDK 21
        uses: actions/setup-java@v4  # Set up JDK 21 for the Maven build
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Setup Firebase config
        run: |
          mkdir -p src/main/resources/config
          echo "${{ secrets.FIREBASE_CONFIG_JSON }}" | base64 -d > src/main/resources/config/artventuria-v1-firebase-adminsdk-fbsvc-f1f7233991.json

      - name: Build with Maven
        run: mvn -B package --file pom.xml  # Build the application using Maven

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/artventuria-api:${{ github.ref_name }} -f .deploy/Dockerfile .  # Build the Docker image

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin  # Log into Docker Hub

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/artventuria-api:${{ github.ref_name }}  # Push the built image to Docker Hub

      - name: Configure SSH and Enable ControlMaster
        run: |
          mkdir -p ~/.ssh
          echo "===== Debugging SSH Setup ===="
          echo "GitHub runner environment: $(uname -a)"
          
          # Create a script to handle passphrase
          cat > ~/.ssh/key_script.sh << 'EOF'
          #!/bin/bash
          echo "${{ secrets.SERVER_SSH_PASSPHRASE }}"
          EOF
          chmod 700 ~/.ssh/key_script.sh
          
          # Decode and save the private key (with error checking)
          echo "${{ secrets.SERVER_SSH_KEY }}" | base64 -d > ~/.ssh/artventuria-key 2>~/.ssh/base64_error.log
          if [ $? -ne 0 ]; then
            echo "ERROR: Failed to decode base64 key - see error:"
            cat ~/.ssh/base64_error.log
            echo "First few characters of the encoded key: $(echo "${{ secrets.SERVER_SSH_KEY }}" | cut -c1-20)..."
          fi
          chmod 600 ~/.ssh/artventuria-key
          
          # Check private key format
          echo "Private key first line: $(head -n 1 ~/.ssh/artventuria-key)"
          echo "Private key type: $(ssh-keygen -l -f ~/.ssh/artventuria-key 2>&1 || echo 'Could not determine key type')"
          
          # Configuration for Oracle Cloud
          echo -e "Host oci\n  HostName ${{ secrets.SERVER_HOST }}\n  User ${{ secrets.SERVER_USER }}\n  IdentityFile ~/.ssh/artventuria-key\n  StrictHostKeyChecking no\n  ControlMaster auto\n  ControlPath ~/.ssh/cm_socket_%r@%h:%p\n  ControlPersist 10m\n  PreferredAuthentications publickey\n  LogLevel DEBUG3" > ~/.ssh/config
          
          echo "===== SSH Config ===="
          cat ~/.ssh/config
          
          echo "===== Testing SSH connection with verbose output ===="
          ssh -v -o StrictHostKeyChecking=no oci 'echo "SSH connection successful"' || echo "SSH connection failed"

      - name: Make deploy script executable
        run: chmod +x .github/scripts/deploy-oci.sh

      - name: Deploy to Server
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          FIREBASE_CONFIG_PATH: ${{ secrets.FIREBASE_CONFIG_PATH }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          AWS_SES_FROM_EMAIL: ${{ secrets.AWS_SES_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: .github/scripts/deploy-oci.sh
