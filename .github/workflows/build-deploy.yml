name: Production Docker Release

on:
  push:
    tags:
      - "v*"  # Trigger the workflow when a new tag starting with 'v' is pushed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner for the job

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2  # Checkout the repository to the runner

      - name: Set up JDK 21
        uses: actions/setup-java@v4  # Set up JDK 21 for the Maven build
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Setup Firebase config
        run: |
          mkdir -p src/main/resources/config
          echo "${{ secrets.FIREBASE_CONFIG_JSON }}" | base64 -d > src/main/resources/config/artventuria-v1-firebase-adminsdk-fbsvc-f1f7233991.json

      - name: Build with Maven
        run: mvn -B package --file pom.xml  # Build the application using Maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .deploy/Dockerfile
          platforms: linux/amd64,linux/arm64  # Build for both Intel/AMD and ARM architectures
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/artventuria-api:${{ github.ref_name }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/artventuria-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/artventuria-api:buildcache,mode=max

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          
          # Decode the private key
          echo "${{ secrets.SERVER_SSH_KEY }}" | base64 -d > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          
          # Configure SSH
          echo -e "Host oci\n  HostName ${{ secrets.SERVER_HOST }}\n  User ${{ secrets.SERVER_USER }}\n  IdentityFile ~/.ssh/deploy-key\n  StrictHostKeyChecking no" > ~/.ssh/config
          
          # Test connection
          ssh -o StrictHostKeyChecking=no oci 'echo "SSH connection successful"'

      - name: Make deploy script executable
        run: chmod +x .github/scripts/deploy-oci.sh

      - name: Deploy to Server
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          FIREBASE_CONFIG_PATH: ${{ secrets.FIREBASE_CONFIG_PATH }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          AWS_SES_FROM_EMAIL: ${{ secrets.AWS_SES_FROM_EMAIL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          API_URL: ${{ secrets.API_URL }}
          MOBILE_DEEPLINK_RESET_PASSWORD: ${{ secrets.MOBILE_DEEPLINK_RESET_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          # AWS credentials for Route53 DNS validation
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: .github/scripts/deploy-oci.sh
