name: Production Docker Release

on:
  push:
    tags:
      - "v*"  # Trigger the workflow when a new tag starting with 'v' is pushed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner for the job

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2  # Checkout the repository to the runner

      - name: Set up JDK 21
        uses: actions/setup-java@v4  # Set up JDK 21 for the Maven build
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build with Maven
        run: mvn -B package --file pom.xml  # Build the application using Maven

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/artventuria-api-java:${{ github.ref_name }} -f .deploy/Dockerfile .  # Build the Docker image

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin  # Log into Docker Hub

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/artventuria-api-java:${{ github.ref_name }}  # Push the built image to Docker Hub

      - name: Configure SSH and Enable ControlMaster
        run: |
          mkdir -p ~/.ssh  # Create the SSH directory if it doesn't exist
          echo "${{ secrets.SERVER_SSH_KEY }}" | base64 -d > ~/.ssh/artventuria-key  # Decode and save the SSH private key
          chmod 600 ~/.ssh/artventuria-key  # Set proper permissions for the SSH key
          echo -e "Host ec2\n  HostName ${{ secrets.SERVER_HOST }}\n  User ec2-user\n  IdentityFile ~/.ssh/artventuria-key\n  StrictHostKeyChecking no\n  ControlMaster auto\n  ControlPath ~/.ssh/cm_socket_%r@%h:%p\n  ControlPersist 10m" > ~/.ssh/config  # Configure SSH for ControlMaster to reuse connections

      - name: Setup Firebase config
        run: |
          mkdir -p src/main/resources/config
          echo "${{ secrets.FIREBASE_CONFIG_JSON }}" | base64 -d > src/main/resources/config/artventuria-v1-firebase-adminsdk-fbsvc-f1f7233991.json

      - name: Deploy to Server
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          FIREBASE_CONFIG_PATH: ${{ secrets.FIREBASE_CONFIG_PATH }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          AWS_SES_REGION: ${{ secrets.AWS_SES_REGION }}
          AWS_SES_FROM_EMAIL: ${{ secrets.AWS_SES_FROM_EMAIL }}
        run: |
          # Initiate ControlMaster with a simple SSH connection
          ssh ec2 "echo Connected"

          # Copy the docker-compose file to the server (faster with ControlMaster enabled)
          ssh ec2 "mkdir -p ~/artventuria-deploy"  # Create the deployment directory on the server
          scp docker-compose.prod.yml ec2:~/artventuria-deploy/  # Copy the production Docker Compose file to the server

          # Execute deployment on the server
          ssh ec2 << 'EOF'
            set -e  # Exit immediately if a command exits with a non-zero status
            cd ~/artventuria-deploy  # Navigate to the deployment directory

            # Create an environment file with sensitive variables
            cat > .env << EOL
DOCKER_USERNAME=${DOCKER_USERNAME}
GITHUB_REF_NAME=${GITHUB_REF_NAME}
DATABASE_PASSWORD=${DATABASE_PASSWORD}
JWT_SECRET=${JWT_SECRET}
EOL

            # Install docker-compose if not available
            if ! command -v docker compose &> /dev/null; then
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Install nginx if not available
            if ! command -v nginx &> /dev/null; then
              sudo yum update -y
              sudo yum install -y nginx
            fi

            # Configure Nginx with SSL (Let's Encrypt)
            sudo tee /etc/nginx/conf.d/api.artventuria.com.conf << 'EOL'
server {
    listen 80;
    server_name api.artventuria.com;
    return 301 https://$server_name$request_uri;
}
server {
    listen 443 ssl;
    server_name api.artventuria.com;
    ssl_certificate /etc/letsencrypt/live/api.artventuria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.artventuria.com/privkey.pem;
    location / {
        proxy_pass http://localhost:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
EOL

            # Install Certbot and request SSL certificate
            sudo yum install -y certbot python3-certbot-nginx || true
            if [ ! -f "/etc/letsencrypt/live/api.artventuria.com/fullchain.pem" ]; then
              sudo certbot --nginx -d api.artventuria.com --non-interactive --agree-tos -m ${CERTBOT_EMAIL}
            fi

            sudo systemctl restart nginx  # Restart nginx to apply the new config

            # Log into Docker Hub again
            echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

            # Pull and deploy the Docker container
            docker compose -f docker-compose.prod.yml down || true  # Stop any running containers
            docker compose -f docker-compose.prod.yml pull  # Pull the latest images
            docker compose -f docker-compose.prod.yml up -d  # Start the containers in detached mode

            # Set up systemd service to manage the Docker Compose app
            sudo tee /etc/systemd/system/artventuria-api.service << 'EOL'
[Unit]
Description=Artventuria API Docker Compose
Requires=docker.service
After=docker.service

[Service]
Type=oneshot
RemainAfterExit=yes
WorkingDirectory=/home/ec2-user/artventuria-deploy
ExecStart=/usr/local/bin/docker-compose -f docker-compose.prod.yml up -d
ExecStop=/usr/local/bin/docker-compose -f docker-compose.prod.yml down
TimeoutStartSec=0

[Install]
WantedBy=multi-user.target
EOL

            # Enable the systemd service to start on boot
            sudo systemctl daemon-reload
            sudo systemctl enable artventuria-api.service
          EOF
