---
## This is the docker compose file for the production environment
version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: artventuria
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - artventuria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - artventuria-network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - artventuria-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    image: ${DOCKER_USERNAME}/artventuria-api:${GITHUB_REF_NAME}
    container_name: artventuria-api
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
      - mongodb
    environment:
      # Database configuration
      database.host: postgres
      database.port: 5432
      database.name: artventuria
      database.username: postgres
      database.password: ${DATABASE_PASSWORD}

      # Kafka configuration
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # MongoDB configuration
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: artventuria

      # JWT configuration
      JWT_SECRET: ${JWT_SECRET}

      # Firebase configuration
      FIREBASE_CONFIG_PATH: ${FIREBASE_CONFIG_PATH}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}

      # AWS SES configuration
      AWS_SES_REGION: ${AWS_SES_REGION}
      AWS_SES_FROM_EMAIL: ${AWS_SES_FROM_EMAIL}

      # Other environment variables
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod

      # Add any other environment variables your application needs
    ports:
      - "8001:8080"
    networks:
      - artventuria-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:5
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: artventuria
    volumes:
      - mongo_data:/data/db
    networks:
      - artventuria-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/artventuria --quiet
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  artventuria-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
